<div class="flex flex-col items-center bg-gray-800 text-gray-100 font-roboto min-h-screen">
  <main class="flex flex-row justify-center w-full max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col w-3/4 pr-8">
      <div class="flex flex-row gap-4 my-8 justify-start items-center">
        <app-tag *ngFor="let tag of tags" [title]="tag"></app-tag>
      </div>

      <section class="flex flex-col gap-8 justify-start items-center">
        <app-article-card
          *ngFor="let _article of articles"
          [article]="_article"
        ></app-article-card>

        <app-article-block [article]="articles[0]"></app-article-block>
      </section>
    </div>
    <div class="w-1/4 pl-8 border-l border-gray-700"></div>
  </main>
  <footer class="w-full bg-gray-900 text-gray-300 text-center py-4 mt-auto shadow-inner">
    <p class="m-0">&copy; 2025 BitBlogger. All rights reserved.</p>
  </footer>
</div>
