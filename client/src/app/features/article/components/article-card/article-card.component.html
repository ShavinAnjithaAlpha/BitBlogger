<div class="bg-gray-900 rounded-xl p-6 shadow-lg flex flex-col items-start w-full transform transition-transform duration-300 hover:scale-[1.01] hover:shadow-2xl">
  <div class="flex items-center w-full mb-4">
    <div class="w-12 h-12 rounded-full overflow-hidden mr-4 ring-2 ring-primary-green flex-shrink-0">
      <img
        src="https://img.freepik.com/free-photo/portrait-white-man-isolated_53876-40306.jpg"
        alt="Author"
        class="w-full h-full object-cover"
      />
    </div>
    <span class="text-gray-400 text-base font-medium">{{ article.author.firstname }}{{ article.author.lastname }}</span>
  </div>
  <div class="flex flex-row justify-between items-start w-full mt-4">
    <div class="flex flex-col justify-center items-start pr-4 w-3/5">
      <h3 class="text-3xl font-semibold text-white mb-2 leading-tight">{{ article.title }}</h3>
      <p class="text-gray-300 text-base leading-relaxed line-clamp-3">
        {{ article.preview }}
      </p>
    </div>
    <div class="w-2/5 h-48 ml-4 overflow-hidden rounded-lg flex-shrink-0">
      <img
        src="https://wallpapers.com/images/featured/vector-art-6ttd2h971c0ivqyh.jpg"
        alt="Trusted Computing"
        class="w-full h-full object-cover rounded-lg transform transition-transform duration-300 hover:scale-105"
      />
    </div>
  </div>
  <div class="flex justify-between items-center w-full pt-4 mt-4 border-t border-gray-700">
    <span class="text-gray-500 text-sm">{{ article.publishedAt }}</span>
    <div class="flex items-center space-x-6">
      <div class="flex items-center">
        <i class="fa-regular fa-comment text-primary-green text-xl cursor-pointer hover:text-green-400 transition-colors duration-200"></i>
        <span class="text-primary-green ml-2 text-base">{{ article.comments }}</span>
      </div>
      <div class="flex items-center">
        <i class="fa-regular fa-heart text-red-500 text-xl cursor-pointer hover:text-red-400 transition-colors duration-200"></i>
        <span class="text-red-500 ml-2 text-base">{{ article.likes }}</span>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <i class="fa-regular fa-bookmark text-gray-400 text-xl cursor-pointer hover:text-white transition-colors duration-200"></i>
      <i class="fas fa-ellipsis-h text-gray-400 text-xl cursor-pointer hover:text-white transition-colors duration-200"></i>
    </div>
  </div>
</div>
