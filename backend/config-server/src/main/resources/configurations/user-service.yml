spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bitblog_users
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  flyway:
    enabled: true
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bitblog_users
    user: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    baseline-version: 1
    baseline-on-migrate: true
    baseline-description: "init"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    database: mysql

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  redis:
    host: localhost
    port: 6379

server:
  port: 9000

