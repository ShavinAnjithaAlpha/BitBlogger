spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bitblog_tags
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/bitblog_tags
    user: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    baseline-on-migrate: true
    baseline-description: "init"
    baseline-version: 1
    enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      TAG-SERVICE:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        sliding-window-size: 10

server:
  port: 9003